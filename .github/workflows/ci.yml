# CI — 로컬 프리커밋 훅과 같은 게이트를 서버에서 강제한다 (하네스: 우회 불가 검증).
# 로컬 훅과 순서·내용을 맞춘다: format:check → lint → typecheck → test:coverage, 이후 E2E·빌드.
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 포맷 검사
        run: npm run format:check

      - name: 린트
        run: npm run lint

      - name: 타입체크
        run: npm run typecheck

      - name: 단위 테스트 + 커버리지 게이트
        run: npm run test:coverage

      - name: 프로덕션 빌드
        run: npm run build

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright 브라우저 설치
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright 시스템 의존성 (캐시 히트 시)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (모바일·데스크톱 + 시각 회귀)
        run: npm run e2e

      - name: 실패 시 E2E 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
